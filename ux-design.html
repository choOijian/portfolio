<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UX Design — Jian Choi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="./style.css" />
  <style>
    .work-page {
      padding-top: calc(var(--spacing-xl) + 60px);
      padding-bottom: var(--spacing-xl);
    }

    .page-header {
      margin-bottom: var(--spacing-xl);
      text-align: center;
    }

    .page-header h1 {
      font-size: clamp(3rem, 6vw, 5rem);
      font-weight: 400;
      letter-spacing: -0.04em;
      margin-bottom: var(--spacing-md);
    }

    .works-grid {
      display: flex;
      justify-content: center;
      margin-top: var(--spacing-sm);
    }

    .work-card {
      display: block;
      width: 100%;
      max-width: 900px;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
      cursor: pointer;
    }

    .work-image-wrapper {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16/9;
      margin-bottom: var(--spacing-sm);
      border-radius: 4px;
      background-color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .work-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-smooth), filter var(--transition-smooth);
    }

    .hover-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity var(--transition-fast);
      z-index: 2;
    }

    .hover-btn {
      padding: 12px 24px;
      background: #fff;
      color: #000;
      border-radius: 30px;
      font-weight: 500;
      font-size: 0.95rem;
      transform: translateY(10px);
      transition: transform var(--transition-smooth);
    }

    .work-card:hover .hover-overlay {
      opacity: 1;
    }

    .work-card:hover .hover-btn {
      transform: translateY(0);
    }

    .work-card:hover .work-image-wrapper img {
      transform: scale(1.03);
    }

    .work-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .work-desc {
      font-size: 1rem;
      color: var(--color-text-muted);
      font-weight: 400;
    }

    /* Lightbox Styles */
    .lightbox {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(255, 255, 255, 0.98);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-fast);
      overflow-y: auto;
      padding: var(--spacing-md);
    }

    .lightbox.show {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-close {
      position: absolute;
      top: 2rem;
      left: 2rem;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--color-text-muted);
      text-decoration: none;
      transition: color var(--transition-fast);
      z-index: 1001;
    }

    .lightbox-close:hover {
      color: var(--color-text);
    }

    .lightbox-content {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lightbox-image-wrapper {
      width: 100%;
      aspect-ratio: 16/9;
      background-color: #eee;
      border-radius: 4px;
      margin-bottom: var(--spacing-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .lightbox-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .lightbox-text {
      max-width: 800px;
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }

    .lightbox-text h2 {
      font-size: 2rem;
      margin-bottom: var(--spacing-md);
      font-weight: 600;
    }

    .lightbox-text p {
      font-size: 1.1rem;
      color: var(--color-text-muted);
      line-height: 1.8;
    }

    .placeholder-text {
      position: absolute;
      z-index: 1;
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--color-text);
    }
  </style>
</head>
<body>
  
  <header class="header">
    <div class="container nav">
      <a href="./index.html" class="logo">Jian Choi.</a>
      <nav class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./about.html">About</a>
        <a href="./ux-design.html" class="active">UX Design</a>
        <a href="./work.html">Work</a>
        <a href="./contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="container work-page">
      <div class="page-header reveal reveal-immediate">
        <h1>UX Design</h1>
      </div>

      <div class="works-grid" id="worksGrid">
        
        <!-- UX Design Big Card -->
        <a href="#detail" class="work-card reveal reveal-immediate" data-category="ux" style="transition-delay: 0.1s; text-decoration: none; color: inherit;" id="uxCard">
          <h3 class="work-title" style="margin-bottom: var(--spacing-md); text-align: left;">Week 2 - 디자인 에스노그라피</h3>
          
          <div class="work-image-wrapper">
            <img src="https://i.postimg.cc/26Kwch19/eseunogeulapi1.png" alt="UX Design Project - 에스노그라피 현장 리서치">
            
            <div class="hover-overlay">
              <span class="hover-btn">View Case Study</span>
            </div>
          </div>
        </a>

      </div>
    </section>

    <!-- Lightbox Modal (이제 상세 화면 역할을 수행함) -->
    <div class="lightbox" id="uxLightbox">
      <a href="#" class="lightbox-close" id="closeLightbox">&larr; Back to List</a>
      <div class="lightbox-content">
        <div class="lightbox-text" style="max-width: 100%; text-align: left; margin-bottom: var(--spacing-md); width: 100%; margin-top: 4rem;">
          <h2>Week 2 - 디자인 에스노그라피</h2>
        </div>
        
        <div class="lightbox-image-wrapper">
          <img src="https://i.postimg.cc/26Kwch19/eseunogeulapi1.png" alt="UX Design Project - 에스노그라피 현장 리서치">
        </div>
        
        <div class="lightbox-image-wrapper">
          <img src="https://i.postimg.cc/qRSFt9X9/eseunogeulapi2.png" alt="UX Design Project - 두 번째 이미지">
        </div>

      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-links">
        <a href="mailto:choijian@sookmyung.ac.kr">Email</a>
        <a href="https://instagram.com/jianarchive" target="_blank">Instagram</a>
      </div>
      <p>© 2024 Jian Choi. All rights reserved.</p>
    </div>
  </footer>

  <script src="./main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const card = document.getElementById('uxCard');
      const lightbox = document.getElementById('uxLightbox');
      const closeBtn = document.getElementById('closeLightbox');

      if (card && lightbox && closeBtn) {
        card.addEventListener('click', (e) => {
          e.preventDefault();
          lightbox.classList.add('show');
          document.body.style.overflow = 'hidden'; // prevent scrolling
          lightbox.scrollTo(0, 0); // scroll to top when opened
        });

        closeBtn.addEventListener('click', (e) => {
          e.preventDefault();
          lightbox.classList.remove('show');
          document.body.style.overflow = '';
        });

        // Close when clicking outside of the content
        lightbox.addEventListener('click', (e) => {
          if (e.target === lightbox) {
            lightbox.classList.remove('show');
            document.body.style.overflow = '';
          }
        });
      }
    });
  </script>
</body>
</html>
